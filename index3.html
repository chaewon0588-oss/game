<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>플래피 점프</title>
  <!-- 레트로 픽셀 글꼴 (영어: Press Start 2P, 한글: Galmuri) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1d1b2f;
      color: #f8f8f8;
      font-family: "Press Start 2P", "Galmuri11", monospace;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 26px;
      color: #fcbf49;
      text-shadow: 4px 4px 0 #d62828;
    }
    #wrap {
      position: relative;
      border: 6px solid #f8f8f8;
      box-shadow: 0 0 0 6px #1d1b2f, 0 0 0 12px #f8f8f8;
    }
    /* 브라운관 TV 같은 가로 줄무늬 */
    #wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.12) 0 2px, transparent 2px 4px);
    }
    canvas {
      display: block;
      width: 400px;
      height: 600px;
      image-rendering: pixelated;   /* 크게 늘려도 흐려지지 않고 네모 점이 보이게 */
    }
    /* 게임 위에 겹쳐 보이는 화면 (시작 / 게임 끝 / 통과) */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: rgba(29, 27, 47, 0.7);
    }
    #message {
      font-size: 30px;
      line-height: 1.4;
      text-shadow: 4px 4px 0 #1d1b2f;
    }
    #subMessage {
      font-family: "Galmuri11", monospace;
      font-size: 18px;
      margin: 18px 0 30px;
      line-height: 1.6;
    }
    #startBtn {
      font-family: "Galmuri11", "Press Start 2P", monospace;
      font-size: 20px;
      padding: 14px 28px;
      border: 4px solid #f8f8f8;
      border-radius: 0;
      background: #d62828;
      color: #f8f8f8;
      cursor: pointer;
      box-shadow: 6px 6px 0 #000;
      animation: blink 1s steps(1) infinite;   /* 테두리 깜빡깜빡 */
    }
    #startBtn:hover {
      background: #f77f00;
    }
    #startBtn:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0 #000;
    }
    @keyframes blink {
      50% { border-color: #fcbf49; }
    }
    p {
      font-family: "Galmuri11", monospace;
      color: #a9a6c9;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>FLAPPY JUMP</h1>
  <div id="wrap">
    <canvas id="game" width="200" height="300"></canvas>
    <div id="overlay">
      <div id="message" style="color:#fcbf49">READY?</div>
      <div id="subMessage">장애물을 피해 길 끝까지 가 보세요!</div>
      <button id="startBtn">게임 시작</button>
    </div>
  </div>
  <p>스페이스바로 점프해요</p>

  <script>
    // ===== 기본 준비 =====
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");   // 그림을 그리는 붓
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const subMessage = document.getElementById("subMessage");
    const startBtn = document.getElementById("startBtn");

    // 게임 안의 크기는 400x600으로 계산하고,
    // 실제 그림은 절반(200x300)으로 그린 뒤 크게 늘려서 픽셀 느낌을 냄
    const W = 400;
    const H = 600;
    const PIXEL = canvas.width / W;   // 0.5

    // ===== 게임 설정 =====
    const GROUND_H = 70;          // 땅 높이
    const GRAVITY = 1400;         // 아래로 끌어당기는 힘
    const JUMP = -420;            // 점프할 때 위로 튀는 힘
    const SPEED = 160;            // 앞으로 가는 속도
    const PIPE_W = 64;            // 장애물 두께
    const PIPE_GAP = 160;         // 위아래 장애물 사이 빈틈
    const PIPE_SPACE = 230;       // 장애물끼리 간격
    const PIPE_COUNT = 15;        // 장애물 개수 (이걸 다 지나면 길 끝)

    // ===== 새(주인공) =====
    const bird = { x: 100, y: 0, r: 15, vy: 0 };

    // ===== 게임 상태 =====
    let pipes = [];
    let finishX = 0;              // 길 끝(결승선) 위치
    let distance = 0;             // 지금까지 온 거리
    let passed = 0;               // 지나간 장애물 수
    let playing = false;
    let lastTime = performance.now();
    let clouds = [];

    // 게임을 처음 상태로
    function resetGame() {
      bird.y = H / 2 - 50;
      bird.vy = 0;
      distance = 0;
      passed = 0;

      // 장애물 만들기: 빈틈 위치는 무작위
      pipes = [];
      for (let i = 0; i < PIPE_COUNT; i++) {
        const minY = 80 + PIPE_GAP / 2;
        const maxY = H - GROUND_H - 80 - PIPE_GAP / 2;
        pipes.push({
          x: 450 + i * PIPE_SPACE,
          gapY: minY + Math.random() * (maxY - minY),   // 빈틈 가운데 높이
          passed: false
        });
      }
      finishX = pipes[pipes.length - 1].x + PIPE_SPACE + 60;
    }

    // 구름 (배경 꾸미기)
    function makeClouds() {
      clouds = [];
      for (let i = 0; i < 5; i++) {
        clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 200, size: 20 + Math.random() * 20 });
      }
    }

    // ===== 조작: 스페이스바 =====
    document.addEventListener("keydown", (e) => {
      if (e.code !== "Space") return;
      e.preventDefault();          // 스페이스로 화면이 내려가거나 버튼이 눌리지 않게
      if (playing) bird.vy = JUMP;
    });

    // ===== 버튼 (게임 시작 / 다시 하기) =====
    startBtn.addEventListener("click", () => {
      resetGame();
      overlay.style.display = "none";
      startBtn.blur();
      playing = true;
      bird.vy = JUMP;              // 시작하자마자 한 번 점프
    });

    function endGame(text, color, sub) {
      playing = false;
      message.innerHTML = text;
      message.style.color = color;
      subMessage.textContent = sub;
      startBtn.textContent = "다시 하기";
      overlay.style.display = "flex";
    }

    // ===== 부딪혔는지 확인 =====
    function hitPipe(p) {
      const sx = p.x - distance;   // 화면에서 장애물 위치
      const r = bird.r - 3;        // 살짝 봐주기
      const inX = bird.x + r > sx && bird.x - r < sx + PIPE_W;
      const inGap = bird.y - r > p.gapY - PIPE_GAP / 2 && bird.y + r < p.gapY + PIPE_GAP / 2;
      return inX && !inGap;
    }

    // ===== 매 순간 움직이기 =====
    function update(dt) {
      // 새: 중력 때문에 점점 빨리 떨어짐
      bird.vy += GRAVITY * dt;
      bird.y += bird.vy * dt;
      if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }   // 하늘 위로는 못 나감

      // 앞으로 가기
      distance += SPEED * dt;

      // 장애물 확인
      for (const p of pipes) {
        if (hitPipe(p)) {
          endGame("GAME<br>OVER", "#d62828", "장애물 " + passed + " / " + PIPE_COUNT + "개 통과");
          return;
        }
        if (!p.passed && p.x + PIPE_W - distance < bird.x) {
          p.passed = true;
          passed++;
        }
      }

      // 땅에 부딪히면 끝
      if (bird.y + bird.r > H - GROUND_H) {
        bird.y = H - GROUND_H - bird.r;
        endGame("GAME<br>OVER", "#d62828", "장애물 " + passed + " / " + PIPE_COUNT + "개 통과");
        return;
      }

      // 결승선에 닿으면 통과
      if (finishX - distance < bird.x) {
        endGame("CLEAR!", "#fcbf49", "길 끝까지 왔어요!");
      }
    }

    // ===== 화면 그리기 =====
    function draw() {
      ctx.setTransform(PIXEL, 0, 0, PIXEL, 0, 0);   // 400x600 기준으로 그린 걸 절반으로 줄여 그림

      // 하늘 (옛날 게임처럼 몇 가지 색 띠로)
      const SKY = ["#2b2d6e", "#3c3f8f", "#5a4fa8", "#8a5fb0", "#c06c9e", "#f08a7e"];
      const band = (H - GROUND_H) / SKY.length;
      SKY.forEach((color, i) => {
        ctx.fillStyle = color;
        ctx.fillRect(0, i * band, W, band + 1);
      });

      // 별
      ctx.fillStyle = "#f8f8f8";
      for (let i = 0; i < 25; i++) {
        const sx = ((i * 97 - distance * 0.1) % W + W) % W;
        const sy = (i * 53) % 220;
        ctx.fillRect(sx, sy, 4, 4);
      }

      // 구름 (장애물보다 천천히 움직여서 멀리 있는 느낌)
      ctx.fillStyle = "rgba(248, 248, 248, 0.25)";
      for (const c of clouds) {
        const cx = ((c.x - distance * 0.3) % (W + 120) + W + 120) % (W + 120) - 60;
        ctx.beginPath();
        ctx.arc(cx, c.y, c.size, 0, Math.PI * 2);
        ctx.arc(cx + c.size, c.y + 5, c.size * 0.8, 0, Math.PI * 2);
        ctx.arc(cx - c.size, c.y + 5, c.size * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // 장애물 (초록 기둥)
      for (const p of pipes) {
        const sx = p.x - distance;
        if (sx > W || sx + PIPE_W < 0) continue;   // 화면 밖이면 안 그림
        const top = p.gapY - PIPE_GAP / 2;
        const bottom = p.gapY + PIPE_GAP / 2;
        drawPipe(sx, 0, top, true);
        drawPipe(sx, bottom, H - GROUND_H - bottom, false);
      }

      // 결승선 (체크무늬 깃발)
      const fx = finishX - distance;
      if (fx < W + 20) {
        const size = 15;
        for (let y = 0; y < H - GROUND_H; y += size) {
          for (let i = 0; i < 2; i++) {
            ctx.fillStyle = (y / size + i) % 2 === 0 ? "#000" : "#f8f8f8";
            ctx.fillRect(fx + i * size, y, size, size);
          }
        }
      }

      // 땅
      ctx.fillStyle = "#8c5a2b";
      ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
      ctx.fillStyle = "#38b764";
      ctx.fillRect(0, H - GROUND_H, W, 14);
      // 땅 무늬 (움직이는 느낌)
      ctx.fillStyle = "#5d3a1a";
      for (let x = -(distance % 40); x < W; x += 40) {
        ctx.fillRect(x, H - GROUND_H + 24, 20, 6);
      }

      drawBird();

      // 위쪽 진행 막대 (길 끝까지 얼마나 왔는지)
      const progress = Math.min(distance / (finishX - bird.x), 1);
      ctx.fillStyle = "#000";
      ctx.fillRect(20, 16, W - 40, 16);
      ctx.fillStyle = "#fcbf49";
      ctx.fillRect(24, 20, (W - 48) * progress, 8);

      // 통과한 장애물 수
      ctx.font = '32px "Press Start 2P", monospace';
      ctx.textAlign = "center";
      ctx.fillStyle = "#000";
      ctx.fillText(passed, W / 2 + 4, 84);     // 그림자
      ctx.fillStyle = "#f8f8f8";
      ctx.fillText(passed, W / 2, 80);
    }

    // 기둥 하나 그리기 (머리 부분이 살짝 넓음)
    function drawPipe(x, y, h, isTop) {
      ctx.fillStyle = "#38b764";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 4;
      ctx.fillRect(x, y, PIPE_W, h);
      ctx.strokeRect(x, y, PIPE_W, h);
      const capH = 24;
      const capY = isTop ? y + h - capH : y;
      ctx.fillRect(x - 5, capY, PIPE_W + 10, capH);
      ctx.strokeRect(x - 5, capY, PIPE_W + 10, capH);
    }

    // 새 그리기 (떨어질 땐 고개를 숙이고, 올라갈 땐 고개를 듦)
    function drawBird() {
      const angle = Math.max(-0.5, Math.min(1.2, bird.vy / 600));
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(angle);

      // 몸
      ctx.fillStyle = "#fcbf49";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 날개
      ctx.fillStyle = "#f8f8f8";
      ctx.beginPath();
      ctx.ellipse(-5, 4, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // 눈
      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(6, -5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(8, -5, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // 부리
      ctx.fillStyle = "#d62828";
      ctx.beginPath();
      ctx.moveTo(12, 0);
      ctx.lineTo(22, 3);
      ctx.lineTo(12, 7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    // ===== 계속 반복 (1초에 약 60번) =====
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.03); // 지난 시간(초)
      lastTime = now;
      if (playing) update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    // 처음 화면
    makeClouds();
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
